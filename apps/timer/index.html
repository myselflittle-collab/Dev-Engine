<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{APP_NAME}}</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="app">
  <h1>⏱️ {{APP_NAME}}</h1>
  <div class="tabs"><button data-m="stopwatch" class="on">Stopwatch</button><button data-m="timer">Timer</button><button data-m="pomodoro">Pomodoro</button></div>
  <div class="card center"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" class="bg"/><circle cx="50" cy="50" r="45" id="arc"/></svg><div id="time">00:00.0</div></div>
  <div class="row setup" id="setup" hidden><input id="min" type="number" min="0" value="5" placeholder="min"><input id="sec" type="number" min="0" max="59" value="0" placeholder="sec"></div>
  <div class="row"><button id="start">Start</button><button class="ghost" id="lap">Lap</button><button class="ghost" id="reset">Reset</button></div><ol id="laps" class="muted"></ol></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
