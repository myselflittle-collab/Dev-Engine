<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{APP_NAME}}</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="app">
  <h1>💰 {{APP_NAME}}</h1><p class="sub">Track where your money goes</p>
  <div class="card totals"><div><span class="muted small">Income</span><b id="inc" class="plus">₹0</b></div><div><span class="muted small">Expenses</span><b id="exp" class="minus">₹0</b></div><div><span class="muted small">Balance</span><b id="bal">₹0</b></div></div>
  <form class="card grid" id="form">
    <input id="desc" placeholder="Description (e.g. Groceries)" required>
    <input id="amt" type="number" step="0.01" min="0" placeholder="Amount" required>
    <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
    <select id="cat"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Health</option><option>Fun</option><option>Salary</option><option>Other</option></select>
    <button>Add</button>
  </form>
  <div class="card"><b>By category</b><div id="bars"></div></div>
  <ul class="card list" id="list"></ul>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
