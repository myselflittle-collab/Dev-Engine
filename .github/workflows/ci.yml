name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Front-end unit tests
        run: npm test
      - name: Backend tests
        run: cd server && npm install --omit=optional --no-audit --no-fund && npm test
